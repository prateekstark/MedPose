[project]
name = "medpose"
version = "0.0.1"
description = "Offline 3D movement analysis from ordinary cameras, for cerebral palsy research"
requires-python = ">=3.9"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
# A system ROS install registers pytest plugins that fail to import in this environment.
addopts = "-p no:launch_testing -p no:launch_ros -p no:ament_copyright -p no:ament_pep257 -p no:ament_flake8 -p no:ament_lint -p no:ament_xmllint -p no:ament_mypy"
